spring:
  application:
    name: orders-service
  datasource:
    url: jdbc:postgresql://localhost:5432/webservice
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 20000
  jpa:
    hibernate:
      ddl-auto: update
      show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  address: 0.0.0.0  
  port: 8080
          
logging:
  level:
    org.springframework: WARN
    com.sandaniel: INFO   